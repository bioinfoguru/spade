name: Build desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Quick frontend check
        run: pnpm build

      - name: Build Tauri app and upload platform bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          uploadWorkflowArtifacts: true
          # Manual runs build workflow artifacts only; v-prefixed tags publish releases.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('SPADE {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Downloads

            **Windows (64-bit)**
            - `spade.exe` — standalone application executable; no installer.
            - `*-setup.exe` — recommended Windows installer.
            - `*.msi` — Windows Installer package for managed deployments.

            **macOS**
            - `*.dmg` — disk image installer. Choose the asset matching your Mac's processor architecture.
            - `*.app.tar.gz` — compressed application bundle.

            **Linux**
            - `*.AppImage` — portable application for most desktop distributions.
            - `*.deb` — Debian, Ubuntu, and other Debian-based distributions.
            - `*.rpm` — Fedora, RHEL, openSUSE, and other RPM-based distributions.

            `latest.json` is release metadata and is not an installer.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload standalone Windows executable to release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" "src-tauri/target/release/SPADE.exe" --clobber
